[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-generator"
version = "0.1.0"
description = "Runtime-ingested, collection-scoped RAG with grounded, cited answers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "typer",
    "pydantic-settings",
    "numpy",
    "pypdf",
    "python-docx",
    "fastembed",
    "anthropic",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]

[project.scripts]
rag = "rag_generator.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
